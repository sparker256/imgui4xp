name: "CMake: Build and create .zip bundle"

on:
  push:
  workflow_call:
    outputs:
      i4xp_version:
        description: "Version string parsed from src/imgui4xp.cpp"
        value: ${{ jobs.package.outputs.i4xp_version }}
  workflow_dispatch:

permissions:
  contents: read

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout all the submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: "Windows: Configure environment"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Select MinGW toolchain instead of the default MSVC.
          echo "CMAKE_GENERATOR=MinGW Makefiles" >> $GITHUB_ENV

      - name: "Linux: Install dependency libraries"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends freeglut3-dev libudev-dev libopenal-dev

      - name: Configure CMake
        working-directory: ${{github.workspace}}/src
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        working-directory: ${{github.workspace}}/src
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{env.BUILD_TYPE}}
        
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{matrix.os}}
          path: ${{github.workspace}}/build/*.xpl
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      i4xp_version: ${{ steps.resolve_version.outputs.i4xp_version }}

    steps:
      - uses: actions/checkout@v6

      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: binaries-ubuntu-latest
          path: imgui4xp/lin_x64

      - name: Download macOS binary
        uses: actions/download-artifact@v8
        with:
          name: binaries-macos-latest
          path: imgui4xp/mac_x64

      - name: Download Windows binary
        uses: actions/download-artifact@v8
        with:
          name: binaries-windows-latest
          path: imgui4xp/win_x64

      - name: Ensure binary permissions
        run: |
          chmod +x imgui4xp/lin_x64/*.xpl imgui4xp/mac_x64/*.xpl || true

      - name: List Final Folder
        run: ls -R -l imgui4xp

      - name: Resolve imgui4xp version
        id: resolve_version
        run: |
          I4XP_VER=$(grep -E '^[[:space:]]*#define[[:space:]]+VERSION_NUMBER' src/imgui4xp.cpp | head -n1 | sed -E 's/^[^"]*"[[:space:]]*([^"[:space:]]+).*/\1/')
          if [[ -z "$I4XP_VER" ]]; then
            echo "::error::Could not resolve VERSION_NUMBER from src/imgui4xp.cpp"
            exit 1
          fi
          echo "I4XP_VERSION=$I4XP_VER" >> "$GITHUB_ENV"
          echo "i4xp_version=$I4XP_VER" >> "$GITHUB_OUTPUT"
          echo "Resolved imgui4xp version: $I4XP_VER"

      - uses: actions/upload-artifact@v7
        with:
          name: imgui4xp_v${{env.I4XP_VERSION}}
          path: |
            ${{github.workspace}}/imgui4xp*
          if-no-files-found: error
